<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #ffffff; }
      .label { font-family: Arial, sans-serif; font-size: 11px; fill: #ffffff; }
      .step { font-family: Arial, sans-serif; font-size: 10px; fill: #fbbf24; }
      .bg-dark { fill: #1e1e1e; }
      .arrow { stroke: #60a5fa; stroke-width: 2; marker-end: url(#arrowhead); }
      .arrow-green { stroke: #10b981; stroke-width: 2; marker-end: url(#arrowhead-green); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#10b981"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="780" height="380" class="bg-dark" rx="5"/>

  <rect x="60" y="50" width="110" height="280" class="bg-dark" stroke="#f59e0b" stroke-width="2" rx="5"/>
  <text x="115" y="80" text-anchor="middle" class="title" fill="#f59e0b">Peer A</text>

  <rect x="345" y="50" width="110" height="100" class="bg-dark" stroke="#8b5cf6" stroke-width="2" rx="5"/>
  <text x="400" y="75" text-anchor="middle" class="title" fill="#8b5cf6">STUN</text>
  <text x="400" y="93" text-anchor="middle" class="title" fill="#8b5cf6">Server</text>

  <rect x="630" y="50" width="110" height="280" class="bg-dark" stroke="#10b981" stroke-width="2" rx="5"/>
  <text x="685" y="80" text-anchor="middle" class="title" fill="#10b981">Peer B</text>

  <line x1="115" y1="110" x2="400" y2="110" class="arrow"/>
  <text x="257" y="105" class="label" fill="#60a5fa">获取公网地址</text>

  <line x1="400" y1="125" x2="115" y2="125" class="arrow-green"/>
  <text x="257" y="120" class="label" fill="#10b981">返回映射地址</text>

  <rect x="65" y="145" width="100" height="45" class="bg-dark" stroke="#4ade80" stroke-width="1" rx="3"/>
  <text x="115" y="163" text-anchor="middle" class="step">收集完成:</text>
  <text x="115" y="180" text-anchor="middle" class="step">[host, srflx]</text>

  <line x1="115" y1="210" x2="685" y2="210" class="arrow"/>
  <rect x="280" y="195" width="240" height="30" class="bg-dark" stroke="#60a5fa" stroke-width="1" stroke-dasharray="4,4" rx="3"/>
  <text x="400" y="213" text-anchor="middle" class="label" fill="#60a5fa">通过信令交换 ICE Candidates</text>

  <line x1="685" y1="110" x2="400" y2="110" class="arrow"/>
  <text x="542" y="105" class="label" fill="#60a5fa">获取公网地址</text>

  <line x1="400" y1="125" x2="685" y2="125" class="arrow-green"/>
  <text x="542" y="120" class="label" fill="#10b981">返回映射地址</text>

  <rect x="65" y="250" width="100" height="60" class="bg-dark" stroke="#fbbf24" stroke-width="1" rx="3"/>
  <text x="115" y="270" text-anchor="middle" class="step">尝试连接:</text>
  <text x="115" y="287" text-anchor="middle" class="step">host → host</text>
  <text x="115" y="304" text-anchor="middle" class="step">srflx → srflx ✓</text>

  <text x="400" y="365" text-anchor="middle" class="label" fill="#9ca3af">NAT 穿越成功，建立直接 P2P 连接</text>
</svg>