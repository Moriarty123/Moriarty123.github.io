<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <defs>
    <style>
      .title { font-size: 16px; font-weight: bold; fill: #e0e0e0; }
      .text { font-size: 12px; fill: #b0b0b0; }
      .box { fill: #1a1a2e; stroke: #4a90d9; stroke-width: 2; }
      .peer-box { fill: #16213e; stroke: #0f3460; stroke-width: 2; }
      .arrow { stroke: #4a90d9; stroke-width: 2; marker-end: url(#arrowhead); }
      .code { font-family: monospace; font-size: 11px; fill: #4ade80; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90d9"/>
    </marker>
  </defs>
  
  <!-- 标题 -->
  <text x="400" y="30" text-anchor="middle" class="title">信令服务器 (WebSocket)</text>
  
  <!-- 服务器框 -->
  <rect x="50" y="45" width="700" height="120" rx="8" class="box"/>
  
  <!-- 内部代码框 -->
  <rect x="70" y="65" width="660" height="80" rx="4" fill="#0f0f1a" stroke="#3a3a4a" stroke-width="1"/>
  
  <!-- 代码内容 -->
  <text x="90" y="90" class="code">rooms: Map {</text>
  <text x="110" y="110" class="code">"room123": { peers: [socketA, socketB], ... }</text>
  <text x="110" y="130" class="code">"room456": { peers: [socketC], ... }</text>
  <text x="90" y="150" class="code">}</text>
  
  <!-- 箭头线 -->
  <line x1="200" y1="165" x2="200" y2="200" class="arrow"/>
  <line x1="400" y1="165" x2="400" y2="200" class="arrow"/>
  <line x1="600" y1="165" x2="600" y2="200" class="arrow"/>
  
  <!-- Peer A -->
  <rect x="150" y="210" width="100" height="60" rx="6" class="peer-box"/>
  <text x="200" y="235" text-anchor="middle" class="title">Peer A</text>
  <text x="200" y="255" text-anchor="middle" class="text">(Offer)</text>
  
  <!-- Peer B -->
  <rect x="350" y="210" width="100" height="60" rx="6" class="peer-box"/>
  <text x="400" y="235" text-anchor="middle" class="title">Peer B</text>
  <text x="400" y="255" text-anchor="middle" class="text">(Answer)</text>
  
  <!-- Peer C -->
  <rect x="550" y="210" width="100" height="60" rx="6" class="peer-box"/>
  <text x="600" y="235" text-anchor="middle" class="title">Peer C</text>
  <text x="600" y="255" text-anchor="middle" class="text">(Join)</text>
</svg>