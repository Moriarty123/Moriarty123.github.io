<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #ffffff; }
      .subtitle { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #fbbf24; }
      .label { font-family: Arial, sans-serif; font-size: 11px; fill: #ffffff; }
      .bg-dark { fill: #1e1e1e; }
      .bg-card { fill: #2d2d2d; }
      .arrow { stroke: #60a5fa; stroke-width: 2; marker-end: url(#arrowhead); }
      .arrow-green { stroke: #10b981; stroke-width: 2; marker-end: url(#arrowhead-green); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#10b981"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="860" height="510" class="bg-dark" rx="5"/>
  <text x="450" y="50" text-anchor="middle" class="title">完整的 WebRTC 通信流程</text>

  <line x1="40" y1="75" x2="860" y2="75" stroke="#374151" stroke-width="1"/>

  <text x="450" y="105" text-anchor="middle" class="subtitle">Phase 1: 信令连接</text>

  <rect x="80" y="125" width="130" height="55" class="bg-card" stroke="#f59e0b" stroke-width="2" rx="4"/>
  <text x="145" y="148" text-anchor="middle" class="label">Peer A</text>
  <text x="145" y="168" text-anchor="middle" class="label" fill="#f59e0b">createRoom</text>

  <rect x="385" y="125" width="130" height="55" class="bg-card" stroke="#60a5fa" stroke-width="2" rx="4"/>
  <text x="450" y="148" text-anchor="middle" class="label">Signaling</text>
  <text x="450" y="168" text-anchor="middle" class="label" fill="#60a5fa">Server</text>

  <line x1="210" y1="152" x2="385" y2="152" class="arrow"/>
  <line x1="385" y1="162" x2="210" y2="162" class="arrow-green"/>

  <rect x="690" y="125" width="130" height="55" class="bg-card" stroke="#10b981" stroke-width="2" rx="4"/>
  <text x="755" y="148" text-anchor="middle" class="label">Peer B</text>
  <text x="755" y="168" text-anchor="middle" class="label" fill="#10b981">joinRoom</text>

  <line x1="755" y1="152" x2="515" y2="152" class="arrow"/>
  <line x1="515" y1="162" x2="755" y2="162" class="arrow-green"/>

  <rect x="385" y="200" width="130" height="30" class="bg-card" stroke="#8b5cf6" stroke-width="1" rx="2"/>
  <text x="450" y="220" text-anchor="middle" class="label" fill="#8b5cf6">peer_joined 通知</text>

  <line x1="40" y1="250" x2="860" y2="250" stroke="#374151" stroke-width="1"/>
  <text x="450" y="280" text-anchor="middle" class="subtitle">Phase 2: SDP 协商</text>

  <rect x="150" y="305" width="100" height="45" class="bg-card" stroke="#f59e0b" stroke-width="2" rx="4"/>
  <text x="200" y="328" text-anchor="middle" class="label">Peer A</text>
  <text x="200" y="343" text-anchor="middle" class="label" fill="#f59e0b">createOffer</text>

  <rect x="650" y="305" width="100" height="45" class="bg-card" stroke="#10b981" stroke-width="2" rx="4"/>
  <text x="700" y="328" text-anchor="middle" class="label">Peer B</text>
  <text x="700" y="343" text-anchor="middle" class="label" fill="#10b981">createAnswer</text>

  <line x1="250" y1="327" x2="650" y2="327" class="arrow"/>
  <text x="450" y="322" text-anchor="middle" class="label" fill="#60a5fa">offer →</text>

  <line x1="650" y1="342" x2="250" y2="342" class="arrow-green"/>
  <text x="450" y="352" text-anchor="middle" class="label" fill="#10b981">← answer</text>

  <line x1="40" y1="370" x2="860" y2="370" stroke="#374151" stroke-width="1"/>
  <text x="450" y="400" text-anchor="middle" class="subtitle">Phase 3: ICE 候选交换</text>

  <rect x="150" y="420" width="100" height="45" class="bg-card" stroke="#f59e0b" stroke-width="2" rx="4"/>
  <text x="200" y="443" text-anchor="middle" class="label">Peer A</text>
  <text x="200" y="458" text-anchor="middle" class="label" fill="#f59e0b">onicecandidate</text>

  <rect x="650" y="420" width="100" height="45" class="bg-card" stroke="#10b981" stroke-width="2" rx="4"/>
  <text x="700" y="443" text-anchor="middle" class="label">Peer B</text>
  <text x="700" y="458" text-anchor="middle" class="label" fill="#10b981">onicecandidate</text>

  <line x1="250" y1="442" x2="650" y2="442" class="arrow"/>
  <line x1="650" y1="452" x2="250" y2="452" class="arrow-green"/>
  <text x="450" y="438" text-anchor="middle" class="label" fill="#60a5fa">candidate →</text>
  <text x="450" y="462" text-anchor="middle" class="label" fill="#10b981">← candidate</text>

  <line x1="40" y1="485" x2="860" y2="485" stroke="#374151" stroke-width="1"/>
  <text x="450" y="515" text-anchor="middle" class="subtitle">Phase 4: 建立连接 (P2P Media Stream)</text>

  <line x1="200" y1="535" x2="700" y2="535" stroke="#4ade80" stroke-width="4" stroke-dasharray="8,4"/>
  <line x1="700" y1="545" x2="200" y2="545" stroke="#4ade80" stroke-width="4" stroke-dasharray="8,4"/>
  <text x="450" y="535" text-anchor="middle" class="label" fill="#4ade80">◄ Audio/Video Stream ►</text>
</svg>